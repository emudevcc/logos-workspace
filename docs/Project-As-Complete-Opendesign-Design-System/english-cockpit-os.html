<!doctype html>
<!--
  English Cockpit OS — refined UI/UX prototype.
  Source of truth: english-cockpit-uiux-plan.md.
  A dark macOS-native, kiosk-reading dashboard (1–3 m). Module names, tabs,
  buttons and label sentences are copied verbatim from the live frontend
  (templates/index.html + static/js/components/*.js). Numeric cells are
  illustrative demo values for layout only — never real API output.
-->
<html lang="en" data-theme="cockpit">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>English Cockpit OS · refined UI prototype</title>
<style>
/* ═══════════ tokens ═══════════════════════════════════════════ */
:root{
  --bg:#1a1a1d; --srf:#242429; --up:#2d2d33; --ln:#3c3c44;
  --fg:#f5f5f7; --mut:#a8a8b2; --faint:#9696a0;
  --acc:#0a84ff; --ok:#30d158;
  --acc-t:#2f9bff; /* accent as text on dark surfaces (≥4.5:1) */
  --acc-d:#0a6dd4; /* deep accent fill (white text ≥4.5:1) */
  --acc-dh:#085eb6; /* deep accent fill, hover */
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --gs:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mo:ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:11px}
::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px;border:3px solid var(--bg);background-clip:content-box}
.serif{font-family:var(--gs)}.mono{font-family:var(--mo);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.fnt{color:var(--faint)}
.shell{display:flex;height:100vh;overflow:hidden}

/* ═══════════ rail (sidebar) ════════════════════════════════════ */
.rail{width:276px;flex:0 0 auto;display:flex;flex-direction:column;
  background:var(--srf);border-right:1px solid var(--ln);padding:20px 14px;gap:20px}
.traffic{display:flex;gap:8px}.traffic i{width:12px;height:12px;border-radius:50%}
.c1{background:#ff5f57}.c2{background:#febc2e}.c3{background:#28c840}
.brand .n{font-weight:660;font-size:15px;letter-spacing:-.01em}
.brand .s{color:var(--faint);font-size:11.5px;margin-top:2px}
.navs{display:flex;flex-direction:column;gap:5px}
.nav{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;
  border-radius:11px;color:var(--mut);font-size:17px;font-weight:560;text-align:left;transition:background .12s,color .12s}
.nav svg{stroke:currentColor}.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.on{background:rgba(10,132,255,.17);color:#fff}
.nav.on svg{stroke:#9ccfff}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;
  border:1px solid var(--ln);border-radius:13px;padding:14px;background:rgba(255,255,255,.015)}
.f1{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;color:#eef}
.f1 svg{stroke:var(--ok)}
.f2{display:flex;align-items:center;gap:12px}
.gring{flex:0 0 auto;width:42px;height:42px}
.gring .t{stroke:rgba(255,255,255,.12)}.gring .b{stroke:var(--acc)}
.ringc{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.f2 .lb{font-size:13px;color:var(--mut);line-height:1.35}
.f2 .lb i{display:block;font-style:normal}
.f2 .lb b{display:block;font-size:18px;font-weight:660;color:#fff;margin-top:2px}
.ref{margin-left:auto;color:var(--faint);border-radius:8px;padding:6px;display:grid;place-items:center}
.ref:hover{color:#fff;background:rgba(255,255,255,.07)}
.ref svg{stroke:currentColor}

/* ═══════════ main ═════════════════════════════════════════════ */
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:22px 24px 52px}
.top{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.hcol{margin-right:auto}
.hcol h1{margin:0;font-size:30px;font-weight:730;letter-spacing:-.02em}
.hcol .ts{color:var(--mut);font-size:14.5px;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);border:1px solid rgba(48,209,88,.4)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.demo{font-family:var(--mo);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;white-space:nowrap}
.view{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:1200px){.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:840px){.g3{grid-template-columns:1fr}}
@media(max-width:760px){
  .rail{width:84px;padding:18px 10px;align-items:center}
  .rail .traffic,.rail .brand,.rail .foot{display:none}
  .nav{justify-content:center;padding:12px 0}
  .nav span{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* card — tapping anywhere opens the module modal */
.card{position:relative;display:flex;flex-direction:column;cursor:pointer;
  background:var(--srf);border:1px solid var(--ln);border-top:3px solid var(--mc,#0a84ff);
  border-radius:var(--r);padding:18px;transition:border-color .13s}
.card:hover{border-color:#61616b}.card:active{transform:translateY(1px)}
.card .book{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.badge{flex:0 0 44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--mc,#0a84ff) 12%,transparent);color:var(--mc,#0a84ff)}
.badge svg{stroke:currentColor}
.bi{width:22px;height:22px;display:block}
.badge .bi{width:24px;height:24px}
.badge svg path{stroke:currentColor}
.card h2{margin:0;font-size:21px;font-weight:660;letter-spacing:-.01em;line-height:1.2}
.card .pl{color:var(--faint);font-size:12px;margin-top:3px;letter-spacing:.01em}
.card .sum{margin-bottom:4px;flex:1}
.card .sum p{margin:0}
.kpis{display:flex;gap:24px}
.kpis b{font-size:24px;font-weight:680;letter-spacing:-.02em}
.kpis span{display:block;margin-top:1px;color:var(--mut);font-size:12px}
.open{color:var(--mut);font-size:13.5px;display:inline-flex;align-items:center;gap:7px;margin-top:12px;transition:color .12s}
.card:hover .open{color:#fff}

/* ═══════════ buttons ══════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:9px 16px;border-radius:11px;font-size:15px;font-weight:620;transition:background .12s}
.btn svg{stroke:currentColor}
.btn.solid{background:var(--acc-d);color:#fff}
.btn.solid:hover{background:var(--acc-dh)}
.btn.solid:focus-visible{outline-color:#fff}
.btn.soft{background:rgba(255,255,255,.08);color:#fff}
.btn.soft:hover{background:rgba(255,255,255,.14)}
.btn.line{color:#e6e6ea;border:1px solid var(--ln)}
.btn.line:hover{border-color:#999}
.btn.live{background:#ff3b30;color:#fff}
.btn.live:hover{background:#e02e24}
.btn.full{width:100%}

/* ═══════════ dialog (S07 · fresh render) ══════════════════════ */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(10,10,12,.6);backdrop-filter:blur(2px)}
.panel{width:min(880px,94vw);max-height:88vh;display:flex;flex-direction:column;
  background:var(--srf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.6)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;border-bottom:1px solid var(--ln);flex:0 0 auto}
.phead .ht{display:flex;flex-direction:column;gap:3px;min-width:0}
.phead .kik{font-family:var(--mo);font-size:11px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mc,#0a84ff)}
.phead h2{margin:0;font-size:22px;font-weight:640;letter-spacing:-.01em;line-height:1.2}
.xp{color:var(--faint);border-radius:9px;padding:7px;display:grid;place-items:center}
.xp:hover{color:#fff;background:rgba(255,255,255,.09)}
.xp svg{stroke:currentColor;width:20px;height:20px}
.pbody{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.pfoot{padding:14px 22px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:9px;flex:0 0 auto}

/* in-modal building blocks */
.cardface{font-family:var(--gs);font-size:30px;line-height:1.5;text-align:center;
  padding:26px 22px;border:1px solid var(--ln);border-radius:14px;background:var(--up)}
.cardface .gap{color:var(--acc)}
.phon{text-align:center;color:var(--mut);font-family:var(--mo);font-size:14px;margin-top:-6px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--ln);flex:0 0 auto}
.tab{padding:10px 16px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mut);font-weight:600;font-size:15px}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--mc,#0a84ff)}
.tabpane{display:flex;flex-direction:column;gap:16px}
.ta{width:100%;background:var(--up);border:1px solid var(--ln);border-radius:12px;color:#fff;
  font-family:var(--gs);font-size:16px;line-height:1.6;padding:13px 15px;resize:vertical}
.ta:focus-visible{outline:2px solid var(--acc)}
.ta[disabled]{opacity:.55;background:rgba(255,255,255,.03)}
.ta::placeholder{color:var(--mut)}
.conv{display:flex;flex-direction:column;gap:9px}
.co{border-radius:12px;padding:10px 14px;font-family:var(--gs);font-size:17px;max-width:78%}
.co.them{background:var(--up);align-self:flex-start}
.co.me{background:rgba(10,132,255,.15);align-self:flex-end;color:#e7f0ff}
.metc{display:flex;gap:14px}
.metc>div{flex:1;background:var(--up);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:center}
.metc b{display:block;font-family:var(--mo);font-size:28px;letter-spacing:-.02em}
.metc span{color:var(--mut);font-size:12px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:16px}
.list li b{font-weight:600}
.list li .wl{font-family:var(--mo);color:var(--acc-t);flex:0 0 auto}
.bkt{color:var(--mut);font-size:13px}
.inrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
</style>
<style>
/* overlay: focused state helpers used by JS */
.centerb{justify-content:center}
:is(.btn)[data-choice].picked{background:rgba(48,209,88,.22);color:#c8ffe0;border:0}
.panel .cardface .gap{color:var(--mc,var(--acc));font-weight:700}
.panel .cardface ins{text-decoration:none}
.card:focus-visible{outline:2px solid var(--mc,var(--acc));outline-offset:2px}
.press .live{font-weight:640}
.phf{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  font-size:13px;font-weight:600;background:rgba(48,209,88,.16);color:#7ee2a5}
.phf.rev{background:rgba(255,214,10,.14);color:#ffd60a}
</style>
</head>
<body>
<div class="shell">

  <!-- ═══ sidebar / nav (S01) ═══ -->
  <aside class="rail" data-od-id="rail">
    <div class="traffic" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>
    <div class="brand"><div class="n">English Cockpit OS</div><div class="s">kiosk · 1–3&nbsp;m reading</div></div>
    <nav class="navs">
      <button class="nav on" data-nav="today" aria-label="Today" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><span>Today</span></button>
      <button class="nav" data-nav="practice" aria-label="Practice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg><span>Practice</span></button>
      <button class="nav" data-nav="speak" aria-label="Speak"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 19v3"/></svg><span>Speak</span></button>
      <button class="nav" data-nav="write" aria-label="Write"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.7 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Write</span></button>
    </nav>

    <!-- ═══ status foot (S02) ═══ -->
    <div class="foot" data-od-id="status-panel">
      <div class="f1">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span>Good morning</span>
      </div>
      <div class="f2">
        <svg class="gring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="t ringc" cx="20" cy="20" r="17"/>
          <circle class="b ringc" cx="20" cy="20" r="17" stroke-dasharray="107" stroke-dashoffset="75"/>
        </svg>
        <span class="lb"><i>Daily goal · reviews done</i><b>6 / 20</b></span>
        <button class="ref" type="button" title="Next auto refresh in 41:07" aria-label="Next content refresh: 41:07">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══ main ═══ -->
  <main class="main" data-od-id="main">
    <div class="top">
      <div class="hcol"><h1 id="vt">Today</h1><div class="ts" id="vsub"></div></div>
      <span class="status"><i></i>Online</span>
      <span class="demo">prototype · demo</span>
    </div>
    <section class="view g3" data-view="today" data-od-id="view-today"></section>
    <section class="view g3" data-view="practice" data-od-id="view-practice" hidden></section>
    <section class="view g3" data-view="speak" data-od-id="view-speak" hidden></section>
    <section class="view g2" data-view="write" data-od-id="view-write" hidden></section>
  </main>
</div>

<!-- ═══ shared module modal (S07) ═══ -->
<dialog class="dlog" id="dlog" aria-labelledby="mt">
  <div class="panel" data-od-id="module-modal">
    <div class="phead">
      <div class="ht"><span class="kik mono" id="mk"></span><h2 class="serif" id="mt"></h2></div>
      <button class="xp" data-close data-od-id="modal-close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="pbody" id="pbody"></div>
    <div class="pfoot"><button class="btn soft" data-close data-od-id="modal-done">Done</button></div>
  </div>
</dialog>

<script>
/* data: real labels from the codebase */
const TITLE={today:"Your next step","word-of-day":"Word & Idiom of the Day",news:"Tech & Business News Pulse",
  podcast:"Daily Audio & Podcast Digest","weekly-plan":"Weekly Plan",srs:"Spaced Repetition Flashcards",
  prep:"Rapid-Fire PREP Drill",grammar:"Verbs & Grammar",shadowing:"Pronunciation Practice",
  voice:"Voice Roleplay Partner",speech:"Speech-Metrics Coach",radio:"Live Radio & Teleprompter",
  declutter:"Writing Coach",register:"Register Swap"};
const MODE={today:"next step",news:"reading + quiz",podcast:"audio digest","weekly-plan":"plan",
  srs:"spaced repetition",prep:"timed drill",grammar:"grammar",shadowing:"repeat + score",
  voice:"roleplay",speech:"live metrics",radio:"captioned radio",declutter:"text coach",register:"5 registers"};
const COL={today:"#0a84ff","word-of-day":"#ffb03a",news:"#5ac8fa",podcast:"#c08bff","weekly-plan":"#6ec9ff",
  srs:"#37d67a",prep:"#1bc8cd",grammar:"#8b9bff",shadowing:"#ff7aa2",voice:"#5ac8fa",speech:"#2ee6a0",
  radio:"#ff5f57",declutter:"#ff6f92",register:"#9aa6ff"};
const ORDER={today:["today","word-of-day","news","podcast","weekly-plan"],practice:["srs","prep","grammar","shadowing"],
  speak:["voice","speech","radio"],write:["declutter","register"]};
const ICONPATH={today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
  "word-of-day":'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  news:'<path d="M4 22h16a2 2 0 0 0 2-2V4H8a2 2 0 0 0-2 2v15a2 2 0 0 1-4 0V9"/><path d="M11 7h7M11 11h7M11 15h4"/>',
  podcast:'<path d="M2 12h2l2-7 3 14 3-12 2 8 2-5h4"/>',
  "weekly-plan":'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M9 1v4M15 1v4M3 11h18"/>',
  srs:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  prep:'<path d="M13 2 3 14h7l-1 8L21 10h-7l1-8z"/>',
  grammar:'<path d="M4 20V5l16-6v14M15 9 6 18"/><path d="M5 12l4 3"/>',
  shadowing:'<path d="M14 3 6 14h5l-1 7 9-12h-6l1-6z"/>',
  voice:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 19v3"/>',
  speech:'<path d="M4 15v7M9 11v11M14 15v7M19 5v17"/><path d="M3 2l18 4"/>',
  radio:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 2l6 5 6-5"/>',
  declutter:'<path d="M12 20h9"/><path d="M16.7 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  register:'<path d="M8 4 3 8l5 4"/><path d="M3 8h16M16 20l5-4-5-4"/><path d="M21 16H5"/>'};

/* card summary bodies (verbatim short copy) */
const SUM={today:`<p>One focused block to begin your study session — start with the next due review.</p>`,
  "word-of-day":`<div class="serif" style="font-size:20px;line-height:1.5">serendipity<div class="mut" style="font-size:14.5px">finding something good without looking for it</div></div>`,
  news:`<p>'Government opens a fresh AI funding round aimed at small UK labs.'</p><p class="mut" style="font-size:13px;margin-top:8px">3 headlines · 2 key words marked</p>`,
  podcast:`<p>BBC Business Briefing · 12 min · captioned.</p>`,
  "weekly-plan":`<p>Speaking, grammar and writing each get a daily short block.</p>`,
  srs:`<div class="kpis"><div><b>14</b><span>new</span></div><div><b>6</b><span>to review</span></div></div>`,
  prep:`<p>Translate prompts against the clock.</p><div style="font-family:var(--mo);font-size:34px;font-weight:720;margin-top:8px">0:00</div>`,
  grammar:`<p>Irregular + phrasal verbs, with a grammar coach for sentences of your own.</p>`,
  shadowing:`<p>Hear the model, repeat it, and see how close you were.</p>`,
  voice:`<p>Practise real conversations out loud, then reply against a partner voice.</p>`,
  speech:`<div class="kpis"><div><b>—</b><span>WPM</span></div><div><b>0</b><span>fillers</span></div><div><b>—</b><span>cadence</span></div></div>`,
  radio:`<p>Live radio with a synced teleprompter and transcript.</p>`,
  declutter:`<p>Polish or correct one of your own drafts, with weak-to-strong verbs highlighted.</p>`,
  register:`<p>Reword one idea across five registers — technical to informal.</p>`};
const VIEW_H={today:["Today","A calm, glanceable start."],practice:["Practice","Memory, timing, grammar and pronunciation."],
  speak:["Speak","Live voice roleplay, coaching and radio."],write:["Write","Polishing and register control."]};

function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}

function icon(m){return `<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONPATH[m]}</svg>`}
function aro(){return `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`}

/* render 4 view grids */
document.querySelectorAll('.view').forEach(sec=>{
  const v=sec.dataset.view;
  ORDER[v].forEach(m=>{
    const card=document.createElement('article');
    card.className='card';card.dataset.open=m;card.dataset.odId='card-'+m;card.style.setProperty('--mc',COL[m]);
    card.tabIndex=0;card.setAttribute('role','button');
    card.setAttribute('aria-haspopup','dialog');
    card.setAttribute('aria-label',TITLE[m]+' — '+MODE[m]+'. Open module.');
    card.innerHTML=`<div class="book">
        <span class="badge">${icon(m)}</span>
        <div><h2>${TITLE[m]}</h2><div class="pl">${MODE[m]}</div></div></div>
      <div class="sum">${SUM[m]}</div>
      <span class="open" aria-hidden="true">Open ${aro()}</span>`;
    sec.appendChild(card);
  });
});
const D=document.getElementById('dlog'), MT=document.getElementById('mt'), MK=document.getElementById('mk'), PH=document.getElementById('pbody');

/* ═══ full per-module modal bodies (fresh render — S07) ═══ */

      <p class="serif" style="text-align:center">Translate that prompt into English.</p>
      <div class="inrow" style="justify-content:center">
        <button class="btn solid" data-prep="show">Reveal answer</button>
        <button class="btn soft" data-prep="next" hidden>Next prompt ${aro()}</button></div>
      <p class="bkt" style="text-align:center" id="preptimer">0:00 · 90-second round</p>`;
    case "grammar": return htmlGrammar();
    case "shadowing": return htmlShadow();
    case "voice": return `
      <p>Roleplay a daily scenario out loud with a partner voice.</p>
      <div class="conv">
        <div class="co them serif">Partner: Let's start — how would you ask to move a meeting?</div>
        <div class="co me serif">You <span class="fnt" style="font-family:var(--ui)">(hold to talk)</span></div>
      </div>
      <div class="inrow"><button class="btn solid press" data-press="record" data-rest="Record your reply">Record your reply ${aro()}</button>
        <button class="btn line">New topic</button></div>`;
    case "speech": return `
      <div class="metc">

      <div class="inrow"><button class="btn solid press" data-press="listen" data-rest="Start listening">Start listening ${aro()}</button></div>`;

/* ═══════════ view / nav switching ═══════════════ */
function view(v){
  if(!VIEW_H[v]) v='today';
  document.querySelectorAll('.nav').forEach(b=>{
    const on=b.dataset.nav===v;
    b.classList.toggle('on',on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.view').forEach(s=>s.hidden = s.dataset.view!==v);
  document.getElementById('vt').textContent=VIEW_H[v][0];
  document.getElementById('vsub').textContent=VIEW_H[v][1];
  try{ localStorage.setItem('cockpit-view',v); }catch(e){}
}

/* ═══════════ modal: open on a fresh render ═══════════ */
function openDlg(m){
  MT.textContent=TITLE[m];
  if(MK) MK.textContent=(MODE[m]||'').toUpperCase();
  PH.innerHTML=bodyHTML(m);
  D.style.setProperty('--mc',COL[m]||'#0a84ff');
  D.showModal();
  wireModal(m);
}

/* ═══════════ per-modal behavior wiring ═══════════ */
function wireModal(m){
  // tab groups: all [data-tabs]
  PH.querySelectorAll('[data-tabs]').forEach(tabs=>{
    tabs.addEventListener('click',(e)=>{
      const b=e.target.closest('[data-step]'); if(!b||!tabs.contains(b)) return;
      tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
      const wrap=PH;
      wrap.querySelectorAll('.pane').forEach(p=>{ p.hidden = p.dataset.pane!==b.dataset.step; });
    });
  });
  phOn('[data-flip]','click',noopFlip);
  phOn('.gradeband [data-grade]','click',(b)=>afterGrade(b));
  phOn('#genweek','click',(b)=>{ b.disabled=true; b.textContent='Week generated ✓'; });
  phOn('[data-prep="show"]','click',(b)=>{ b.hidden=true;
    const nx=PH.querySelector('[data-prep="next"]'); if(nx) nx.hidden=false;
    const face=PH.querySelector('[data-prep] .cardface, .cardface');
    if(face){ const gp=face.querySelector('.gap'); if(gp) gp.textContent='尽快回复 → reply promptly'; } });
  phOn('[data-weak]','click',()=>{ const r=PH.querySelector('[data-rev]'); if(r) r.hidden=false; });
  // grammar answer choices
  PH.querySelectorAll('.pane').forEach(pn=>{
    pn.querySelectorAll('[data-choice]').forEach(b=>{ b.classList.add('choice');
      b.addEventListener('click',()=>{
        pn.querySelectorAll('[data-choice]').forEach(x=>{ x.classList.remove('picked'); x.removeAttribute('aria-pressed'); });
        b.classList.add('picked'); b.setAttribute('aria-pressed','true'); }); });
    const chk=pn.querySelector('[data-check]');
    if(chk) chk.addEventListener('click',()=>{
      const fb=pn.querySelector('[data-fb]'); if(!fb) return;
      const picked=pn.querySelector('[data-choice].picked');
      fb.textContent = picked ? 'Checked — answered. Press next to move on.' : 'Pick an answer first.';
      fb.style.color = picked ? '#30d158' : 'var(--fnt)'; });
  });
  const coach = PH.querySelector('[data-asq]');
  if(coach) coach.addEventListener('click',()=>{
    const ta=PH.querySelector('[data-in]'), fb=PH.querySelector('[data-fb2]');
    const q=(ta&&ta.value)||'';
    coach.textContent='Asked ✓'; if(fb){ fb.textContent = q.trim()?
      'Coach: “'+q.trim()+'” — you can tighten it to: “reschedule the slot before it slips”.' : 'Type a phrase first.'; } });
  // rewrite (register)
  const rwBtn=PH.querySelector('[data-rewrite]');
  if(rwBtn) rwBtn.addEventListener('click',()=>{
    const ta=PH.querySelector('[data-out]'); if(!ta) return;
    const cur=PH.querySelector('.tabs .tab.on'); const i=cur?Number(cur.dataset.step):0;
    ta.value=REG[i%REG.length]||''; ta.disabled=false;
    rwBtn.textContent='Rewritten ✓'; setTimeout(()=>{ rwBtn.innerHTML='Rewrite '+aro(); },1500); });
  // declutter (polish/correct share one button toggled by tab)
  const modeBtn=PH.querySelector('[data-modebtn]');
  if(modeBtn){
    let goal='polish';
    PH.querySelectorAll('[data-tabs] .tab').forEach(t=> t.addEventListener('click',()=>{
      goal = t.dataset.step==='0' ? 'polish':'correct';
      modeBtn.dataset.goal=goal; modeBtn.textContent = goal==='polish'?'Polish draft':'Correct text'; }));
    modeBtn.addEventListener('click',()=>{
      const rev=PH.querySelector('[data-rev]'); const cop=PH.querySelector('[data-copy]');
      if(rev) rev.hidden=false; if(cop) cop.disabled=false;
      modeBtn.textContent = goal==='polish'?'Polished ✓':'Corrected ✓';
      setTimeout(()=>{ modeBtn.innerHTML='Polish draft'; },1400); });
  }
  // press-style toggles by intent
  PH.querySelectorAll('[data-press]').forEach(b=>{
    const p=b.dataset.press, rest=b.dataset.rest||'Record';
    b.addEventListener('click',()=>{
      if(p==='listen'||p==='record'){
        const on=b.classList.toggle('live');
        b.setAttribute('aria-pressed',String(on));
        b.textContent=on?(p==='listen'?'● Live…':'● Recording…'):rest;
        return; }
      // momentary (preview / clip / clear)
      b.classList.add('live'); b.setAttribute('aria-pressed','true'); b.textContent='…';
      setTimeout(()=>{ b.classList.remove('live'); b.setAttribute('aria-pressed','false'); b.textContent=rest; },650);
    });
  });
}
function noopFlip(){ flipSRS(); }
function phOn(sel,ev,fn){ PH.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,()=>fn(el))); }
function flipSRS(){
  const card=PH.querySelector('#srscard'); if(!card) return;
  const g=PH.querySelector('#grading');
  if(card.dataset.side==='front'){
    card.innerHTML='<i>a new, original or unusual idea</i> — “a novel approach”';
    card.dataset.side='back'; if(g) g.hidden=false;
  } else { card.innerHTML='<b>novel</b><div class="phon" style="margin-top:10px">/ˈnɒv.əl/</div>';
    card.dataset.side='front'; if(g) g.hidden=true; }
}
function afterGrade(btn){
  // advance to next sample card
  const card=PH.querySelector('#srscard');
  if(card){ card.innerHTML='<b>advocate</b><div class="phon" style="margin-top:10px">/ˈæd.və.keɪt/</div>'; card.dataset.side='front'; }
  const g=PH.querySelector('#grading'); if(g) g.hidden=true;
  btn.blur();
}
/* ═══════════ delegation (cards, nav, close) ═══════════ */
document.addEventListener('click',(e)=>{
  const elt=e.target.closest?e.target.closest('[data-nav],[data-open],[data-close],[data-close-modal],[data-prep="next"]'):null;
  if(!elt) return;
  if(elt.hasAttribute('data-close')){ e.preventDefault(); D.close(); return; }
  if(elt.hasAttribute('data-close-modal')){ e.preventDefault(); D.close(); return; }
  if(elt.hasAttribute('data-nav')){ e.preventDefault(); view(elt.dataset.nav); return; }
  if(elt.hasAttribute('data-open')){ e.preventDefault();
    if(D.open) D.close(); openDlg(elt.dataset.open); return; }
  if(elt.dataset.prep==='next'){ e.preventDefault(); nextPrep(); }
});
function nextPrep(){
  const face=PH.querySelector('.cardface'); if(!face) return;
  const prompts=["“请把会议改到明天” — please move the meeting to tomorrow",
                 "“我们尽快回复他” — reply to him soon",
                 "“这份报告需要重写” — this report needs a rewrite"];
  const r=Math.floor(Math.random()*prompts.length);
  const inText=prompts[r].split(' — ')[0], shown=prompts[r].split(' — ')[1];
  face.innerHTML=inText+' <span class="mut" style="font-size:.7em;font-family:var(--mo)">→ '+shown+'</span>';
  const rv=PH.querySelector('[data-prep="show"]'); if(rv) rv.hidden=false;
  const nx=PH.querySelector('[data-prep="next"]'); if(nx) nx.hidden=true;
}

/* keyboard: focused card opens on Enter/Space */
document.addEventListener('keydown',(e)=>{
  const c=e.target.closest&&e.target.closest('.card[data-open]');
  if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); if(D.open) D.close(); openDlg(c.dataset.open); }
});

/* keyboard: space flips SRS card, 1–4 grades */
document.addEventListener('keydown',(e)=>{
  if(!D.open) return;
  if(e.key===' '){ e.preventDefault(); flipSRS(); }
  else if(['1','2','3','4'].includes(e.key)){ const b=PH.querySelector('.gradeband [data-grade="'+e.key+'"]'); if(b) afterGrade(b); }
});

/* restore last panel (or default to Today) */
(function(){ let v='today';
  try{ const s=localStorage.getItem('cockpit-view'); if(s&&VIEW_H[s]) v=s; }catch(e){}
  view(v);
})();
